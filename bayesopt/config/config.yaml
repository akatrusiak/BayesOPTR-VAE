defaults:
  - _self_
  - beam: devel
  - sim: hebt2
misalignments: null

mode: sim # 'beam' or 'sim'

hydra:
  run:
    dir: ./bo_runs/beam/${now:%Y%m%d}_${now:%H%M%S}
  job:
    chdir: true


#higher level model stuff
model: 'standard' # 'standard' 'multi-objective' 'constrained' 
objective: 'current' # 'current' 'alignment'
objective_units: 'pA' # 'pA' ''
bound: 'none' # 'none' 'steerers' 'quads' 'all' 
bound_safety_factor: 1 # amount to scale the bounds from theoretical minimum (deflection = 2mrad * safety )

# initial sampling types
sampling: 'fixed' # 'fixed' 'variable' 'informed'
initial_points: 20 # only applies for fixed

# plotting config
make_plots: true
xlabel: "Steerer Value (A)"
ylabel: "Transmission %"
fit_vs_scan: false # a 1D posterior scan, time-consuming
fit_vs_scan_points: 15

switch_time: 5 # seconds to wait when switching zero if "zero switching" activated on a steerer

#iterations
iterations: 60
zero_beta_iterations: 0 # number of iterations to run at end with 0 beta

#Acquisition function parameters
acquisition_function: UCB  #UCB, EI, EHVI, qNEI
beta: 2

#Acquisition function optimization parameters
num_restarts: 20
raw_samples: 10000

#initial sampling
random_starting_means: false # if True, uses random starting values between min and max, otherwise use mean and variance defined in sim or beam config
deterministic_sampling: false # sets the seed for random number generation to always be the same, ensuring deterministic random numbers for controlled sampling trials
sampling_threshold: 5 # threshold to cross when objective value is reached

# defines the covariance kernel, type can be "Matern" or "Gaussian"
kernel: 
  type: "Matern" 
  nu: 2.5
  lengthscale_prior:
    type: "Gamma"
    concentration: 3.01 #10 #10 
    rate: 6.01 #0.01 #20 
  outputscale_prior:
    type: "Gamma"
    concentration: 2.0 #11 #5 
    rate: 0.15 #0.01 #2

penalisation_param:
  gaussian:
    sigma: 0.25 # >0       determines how wide the gaussian is. 
  quadratic:  
    penalty_factor: 4  # >= 1     determines how wide the parabola. zero crossing at sqrt(penalty_factor)


# Simulation parameters, only used if mode is 'sim'
profile: False # can be used in the future to compare beam profiles at known measurement points
save_gif: False # makes tuning gif


# mean_function: null
mean_function:
  surrogate_path: /abs/path/to/surrogate_best.pt
  delta_yaml: /abs/path/to/Misalignments.yaml
  delta_names: [MISALIGNX1, MISALIGNY1, MISALIGNX2, MISALIGNY2,
                HEBT2:Q2:MISALIGNX, HEBT2:Q2:MISALIGNY, ...,
                HEBT2:Q7:MISALIGNX, HEBT2:Q7:MISALIGNY]
  surrogate_input_names: [HEBT2:XCB2, HEBT2:YCB2, HEBT2:XCB4, HEBT2:YCB4,
                           HEBT2:Q5:CUR, HEBT2:Q6:CUR,
                           HEBT2:XCB6, HEBT2:YCB6, HEBT2:Q7:CUR]
  device: cpu
