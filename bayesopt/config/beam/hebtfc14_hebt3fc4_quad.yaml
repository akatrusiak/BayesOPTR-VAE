    starting_var: 6.0
    max_incremental_change: 60.0
    set_zero_crossing: false
  HEBT3:Q4:CUR:
    type: quad
    lower_bound: 0.0
    upper_bound: 60.0
    starting_mean: 30.0
    starting_var: 6.0
    max_incremental_change: 60.0
    set_zero_crossing: false
measurement_device:
  type: fc
  loc: 745.56236
  pv: HEBT3:FC4:SCALECUR
  measure_points: 20
  trim_ratio: 0.2
  ptime: 0.01
  scale_factor: 1000000000000
