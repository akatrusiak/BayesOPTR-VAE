jaya_url: "https://vpn.beta.hla.triumf.ca/jaya/"
initial_transmission: 1095.703125 #write value initial cup reading in pA
beam_energy: 24000 #beam energy in keV
beam_mass: 16 # beam mass in amu (only needed for magnetic steering)
beam_chargestate: 3 # beam chargestate (only needed for magnetic steering)
steering_elements:
  HEBT:XCB14:CUR:
    type: steerer
    lower_bound: -3.0
    upper_bound: 3.0
    starting_mean: 0.0
    starting_var: 0.6
    max_incremental_change: 6.0
    set_zero_crossing: true
  HEBT:YCB14:CUR:
    type: steerer
    lower_bound: -3.0
    upper_bound: 3.0
    starting_mean: 0.0
    starting_var: 0.6
    max_incremental_change: 6.0
    set_zero_crossing: true
  HEBT:XCB16:CUR:
    type: steerer
    lower_bound: -3.0
    upper_bound: 3.0
    starting_mean: 0.0
    starting_var: 0.6
    max_incremental_change: 6.0
    set_zero_crossing: true
  HEBT:YCB16:CUR:
    type: steerer
    lower_bound: -3.0
    upper_bound: 3.0
    starting_mean: 0.0
    starting_var: 0.6
    max_incremental_change: 6.0
    set_zero_crossing: true
  HEBT3:XCB2:CUR:
    type: steerer
    lower_bound: -3.0
    upper_bound: 3.0
    starting_mean: 0.0
    starting_var: 0.6
    max_incremental_change: 6.0
