jaya_url: "https://vpn.beta.hla.triumf.ca/jaya/"
initial_transmission: 500.5 #write value initial cup reading in pA
beam_energy: 6976 #beam energy in keV
beam_mass: 16 # beam mass in amu (only needed for magnetic steering)
beam_chargestate: 3 # beam chargestate (only needed for magnetic steering)
steering_elements:
  HEBT2:XCB2:CUR:
    type: steerer
    lower_bound: -3.0
    upper_bound: 3.0
    starting_mean: 0.0
    starting_var: 0.6
    max_incremental_change: 6.0
    set_zero_crossing: true
  HEBT2:YCB2:CUR:
    type: steerer
    lower_bound: -3.0
    upper_bound: 3
    starting_mean: 0.0
    starting_var: 0.6
    max_incremental_change: 6.0
    set_zero_crossing: true
  HEBT2:XCB4:CUR:
    type: steerer
    lower_bound: -100.0
    upper_bound: 100.0
    starting_mean: 0.0
    starting_var: 20.0
    max_incremental_change: 200.0
    set_zero_crossing: true
  HEBT2:YCB4:CUR:
    type: steerer
    lower_bound: -100.0
    upper_bound: 100.0
    starting_mean: 0.0
    starting_var: 20.0
    max_incremental_change: 200.0
    set_zero_crossing: true
  HEBT2:Q5:CUR:
    type: quad
    lower_bound: 0  
    upper_bound: 60
    starting_mean: 30.0
    starting_var: 6.0
    max_incremental_change: 60.0
    set_zero_crossing: false
  HEBT2:Q6:CUR:
    type: quad
    lower_bound: 0 
    upper_bound: 60
    starting_mean: 30.0
    starting_var: 6.0
    max_incremental_change: 60.0
    set_zero_crossing: false
  HEBT2:XCB6:CUR:
    type: steerer
    lower_bound: -100.0
    upper_bound: 100.0
    starting_mean: 0.0
    starting_var: 20.0
    max_incremental_change: 200.0
    set_zero_crossing: true
  HEBT2:YCB6:CUR:
    type: steerer
    lower_bound: -100.0
    upper_bound: 100.0
    starting_mean: 0.0
    starting_var: 20.0
    max_incremental_change: 200.0
    set_zero_crossing: true
  HEBT2:Q7:CUR:
    type: quad
    lower_bound: 0  
    upper_bound: 60
    starting_mean: 30.0
    starting_var: 6.0
    max_incremental_change: 60.0
    set_zero_crossing: false
measurement_device:
  type: fc
  loc: 750.6730100000001
  pv: DRA:FC1:SCALECUR
  measure_points: 20
  trim_ratio: 0.2
  ptime: 0.01
  scale_factor: 1000000000000
common_elements: {}
#scale factor is a fudge factor to make all FC measurements be in pA
